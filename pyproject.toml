[project]
name = "neural-net"
version = "0.1.0"
description = "A tiny neural network library built from scratch in NumPy — for learning how autograd, backprop, and optimizers actually work."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anant Desai", email = "adesai773@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "numpy>=2.4.4",
    "tqdm>=4.68.4",
]

[project.urls]
Repository = "https://github.com/adesai773/neural-net"
Issues = "https://github.com/adesai773/neural-net/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_net"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "py-spy>=0.4.2",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "ruff>=0.16.0",
    "snakeviz>=2.2.2",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.9"]

[project.scripts]
nn-regression-1d = "neural_net.examples.regression_1d:main"


[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.format]
# defaults are fine — black-compatible

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

